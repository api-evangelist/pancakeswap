openapi: 3.2.0
info:
  title: PancakeSwap Profile Miscellaneous API
  description: 'REST API for PancakeSwap user profile data including usernames, leaderboard rankings by trading volume, team competitions, and profile registration. Supports CORS for cross-origin access.

    '
  version: '1.0'
  contact:
    name: PancakeSwap
    url: https://pancakeswap.finance
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://profile.pancakeswap.com/api
  description: PancakeSwap Profile API
tags:
- name: Miscellaneous
paths:
  /version:
    get:
      operationId: getVersion
      summary: Get API version
      description: Retrieves the current API version.
      tags:
      - Miscellaneous
      responses:
        '200':
          description: Successful response with API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              example:
                version: 1.0.0
components:
  schemas:
    VersionResponse:
      type: object
      properties:
        version:
          type: string
          description: API version number
          example: 1.0.0
